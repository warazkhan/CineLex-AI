apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cinellex-ai
  namespace: argocd          # ArgoCD always lives in its own namespace
  # No finalizers — avoids namespace-stuck issues you already hit
spec:
  project: default

  source:
    repoURL: https://github.com/warazkhan/CineLex-AI
    targetRevision: dev      # branch ArgoCD watches
    path: k8s                  # folder inside the repo with your manifests
    directory:
      recurse: false           # set true if you add subdirectories later

  destination:
    server: https://kubernetes.default.svc   # in-cluster (minikube)
    namespace: cinellex

  syncPolicy:
    automated:
      prune: true              # delete resources removed from Git
      selfHeal: true           # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true   # creates cinellex ns if missing
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m