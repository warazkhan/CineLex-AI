apiVersion: v1
kind: PersistentVolume
metadata:
  name: cinellex-data-pv
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: cinellex-production
    name: cinellex-data-pvc
  hostPath:
    path: /tmp/cinellex-data    # ‘Â… /tmp always exists on the node
    type: DirectoryOrCreate     # ‘Â… creates it if missing

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cinellex-data-pvc
  namespace: cinellex-production
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

