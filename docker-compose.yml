version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: warazkhan/cinellex-ai:latest
    container_name: cinellex-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./cinellex_rag/retrieval/chroma_store:/app/cinellex_rag/retrieval/chroma_store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    image: warazkhan/cinellex-ai:latest
    container_name: cinellex-streamlit
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped