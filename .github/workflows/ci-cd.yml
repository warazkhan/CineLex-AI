name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'k8s/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1 — Test
  # ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install package (editable) for test imports
        run: pip install -e . --no-deps

      - name: Run tests
        run: pytest tests/
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  # ──────────────────────────────────────────────
  # JOB 2 — Build & Push
  # Skipped entirely on PRs
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (staging tag)
        if: github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            warazkhan/cinellex-ai:${{ github.sha }}
            warazkhan/cinellex-ai:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (production tag)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            warazkhan/cinellex-ai:${{ github.sha }}
            warazkhan/cinellex-ai:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Render auto-deploy: ping the deploy hooks after the image is pushed ──
      - name: Trigger Render deploy (API)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_API not set — skipping"; exit 0
          fi
          curl -fsSL -X POST "$HOOK"

      - name: Trigger Render deploy (UI)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_UI }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_UI not set — skipping"; exit 0
          fi
          curl -fsSL -X POST "$HOOK"

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # ──────────────────────────────────────────────
  # JOB 3 — Update gitops branch (never touches dev/main)
  # This is what kills the loop permanently
  # ──────────────────────────────────────────────
  update-manifests:
    name: Update K8s Manifests → gitops branch
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout gitops branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: gitops                      # ← always writes here, never dev/main

      - name: Update image tag in manifests
        run: |
          NEW_TAG="${{ github.sha }}"
          IMAGE="warazkhan/cinellex-ai"

          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            # staging manifests
            sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${NEW_TAG}|g" k8s/staging/04-api-deployment.yaml
            sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${NEW_TAG}|g" k8s/staging/06-streamlit-deployment.yaml
          else
            # production manifests
            sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${NEW_TAG}|g" k8s/production/04-api-deployment.yaml
            sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${NEW_TAG}|g" k8s/production/06-streamlit-deployment.yaml
          fi

      - name: Commit and push to gitops branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --staged --quiet || git commit -m "deploy: ${{ github.ref_name }} → ${{ github.sha }}"
          git push origin gitops

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true