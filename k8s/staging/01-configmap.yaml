apiVersion: v1
kind: ConfigMap
metadata:
  name: cinellex-config
  namespace: cinellex-staging
data:
  # In-cluster DNS for the API ClusterIP service (05-api-nodeport.yaml). Must
  # carry the real namespace — a bare ".cinellex." does not resolve.
  API_URL: "http://cinellex-api-svc.cinellex-staging.svc.cluster.local:8000"
